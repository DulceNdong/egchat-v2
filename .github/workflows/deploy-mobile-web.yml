name: Deploy App Nativa a Vercel + Render

on:
  push:
    branches: [mobile]
  workflow_dispatch:

jobs:
  deploy:
    name: Build y Deploy App Nativa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: egchat-mobile
        run: npm install --legacy-peer-deps

      - name: Build web
        working-directory: egchat-mobile
        env:
          EXPO_PUBLIC_API_URL: https://egchat-api.onrender.com
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CI: false
        run: npx expo export --platform web --output-dir dist

      - name: Deploy a Vercel
        working-directory: egchat-mobile
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes

  deploy-render:
    name: Trigger Render API Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook A
        run: curl -s "https://api.render.com/deploy/srv-d79po8dm5p6s73a7rcu0?key=_SNH3dpUT0k" || true
      - name: Trigger Deploy Hook B
        run: curl -s "https://api.render.com/deploy/srv-d996ugok1i2s73dommg0?key=UebV9zfEs8o" || true
