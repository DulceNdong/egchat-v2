name: Deploy App + Backend (Vercel + Render)

on:
  push:
    branches: [mobile]
  workflow_dispatch:

env:
  RENDER_API_URL: https://egchat-api-xlxj.onrender.com
  EGCHAT_API_REPO: DulceNdong/egchat-api

jobs:
  sync-backend:
    name: Sync server → egchat-api → Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout egchat-v2
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.EGCHAT_API_SYNC_TOKEN }}

      - name: Checkout egchat-api para push
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EGCHAT_API_REPO }}
          token: ${{ secrets.EGCHAT_API_SYNC_TOKEN }}
          path: api-repo

      - name: Sincronizar server/ → egchat-api
        run: |
          rsync -av --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .env \
            --exclude '*.log' \
            --exclude firebase-service-account.json \
            server/ api-repo/

          cd api-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "ℹ️  Backend sin cambios respecto a egchat-api"
          else
            git commit -m "sync: egchat-v2@${{ github.sha }} [auto]"
            git push origin HEAD:main
            echo "✅ Backend sincronizado en egchat-api"
          fi

      - name: Trigger Render deploy
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK no configurado — Render usará auto-deploy de egchat-api"
            exit 0
          fi
          curl -sf -X POST "$RENDER_DEPLOY_HOOK" || echo "⚠️  No se pudo disparar el deploy"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  deploy-mobile:
    name: Build y Deploy App Nativa
    runs-on: ubuntu-latest
    needs: sync-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: egchat-mobile
        run: npm install --legacy-peer-deps

      - name: Build web
        working-directory: egchat-mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ env.RENDER_API_URL }}
          CI: false
        run: npx expo export --platform web --output-dir dist

      - name: Deploy a Vercel
        working-directory: egchat-mobile
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️  VERCEL_TOKEN no configurado — se omite el deploy de la web"
            exit 0
          fi
          npx vercel --prod --token "$VERCEL_TOKEN" --yes

  verify-backend:
    name: Verificar backend en Render
    runs-on: ubuntu-latest
    needs: sync-backend
    steps:
      - name: Esperar arranque de Render
        run: sleep 30

      - name: Comprobar health y rutas críticas
        run: |
          node - << 'EOF'
          const https = require('https');
          const API = process.env.RENDER_API_URL.replace('https://', '');

          function req(method, path) {
            return new Promise((resolve) => {
              const body = '{}';
              const rq = https.request({
                hostname: API,
                path,
                method,
                timeout: 15000,
                headers: { 'Content-Type': 'application/json', 'Content-Length': body.length }
              }, (res) => {
                let b = '';
                res.on('data', (c) => b += c);
                res.on('end', () => resolve({ code: res.statusCode, body: b }));
              });
              rq.on('timeout', () => { rq.destroy(); resolve({ code: 0, body: 'timeout' }); });
              rq.on('error', (e) => resolve({ code: 0, body: e.message }));
              rq.write(body);
              rq.end();
            });
          }

          async function waitForHealth(maxWaitMs = 180000) {
            const start = Date.now();
            while (Date.now() - start < maxWaitMs) {
              const r = await req('GET', '/health');
              if (r.code === 200) return r;
              console.log(`⏳ Render aún arrancando (${r.body.slice(0,40)}) — reintentando en 15s...`);
              await new Promise(res => setTimeout(res, 15000));
            }
            return { code: 0, body: 'timeout after 3 min' };
          }

          (async () => {
            const health = await waitForHealth();
            let version = 'sin version';
            try {
              const d = JSON.parse(health.body);
              if (d.version) version = d.version;
            } catch {}

            const routes = [
              ['GET', '/api/auth/me'],
              ['GET', '/api/chats'],
              ['GET', '/api/wallet/limits'],
              ['GET', '/api/lia/status'],
            ];

            let ok = 0;
            for (const [m, p] of routes) {
              const s = await req(m, p);
              if (s.code !== 404 && s.code !== 0) ok++;
            }

            console.log(`Health: ${health.body}`);
            console.log(`Versión: ${version}`);
            console.log(`Rutas: ${ok}/${routes.length}`);

            if (health.code !== 200 || ok < routes.length) {
              console.error('❌ Backend no listo tras deploy');
              process.exit(1);
            }
            console.log('✅ Backend verificado');
          })();
          EOF
        env:
          RENDER_API_URL: ${{ env.RENDER_API_URL }}
