name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  vercel:
    name: Vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {"version":3,"routes":[{"src":"/sw.js","dest":"/sw.js","headers":{"Cache-Control":"no-cache,no-store,must-revalidate"}},{"src":"/manifest.json","dest":"/manifest.json","headers":{"Cache-Control":"no-cache,no-store,must-revalidate"}},{"src":"/assets/(.*)","dest":"/assets/$1"},{"src":"/(.*\\.(js|css|png|jpg|svg|ico|json|woff|woff2|ttf|webp|gif))","dest":"/$1"},{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}
          EOF

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_HkTg1iNCyLOOmGGmyd4jD5uL
          VERCEL_PROJECT_ID: prj_9qzYAHpFlidijZq8ijsWbpVf7lmY
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
