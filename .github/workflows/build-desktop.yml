name: Build Desktop Apps (Tauri)

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows — ${{ matrix.app }}
    runs-on: windows-latest
    strategy:
      matrix:
        app: [bange, empresa]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-${{ matrix.app }}/src-tauri

      - name: Build dashboard
        working-directory: apps/dashboard-${{ matrix.app }}
        run: |
          npm install
          npm run build

      - name: Build Tauri (Windows)
        working-directory: apps/desktop-${{ matrix.app }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          npm init -y
          npm install --save-dev @tauri-apps/cli@^2
          npx tauri build --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: |
            apps/desktop-${{ matrix.app }}/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop-${{ matrix.app }}/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-macos:
    name: macOS — ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      matrix:
        app: [bange, empresa]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-${{ matrix.app }}/src-tauri

      - name: Build dashboard
        working-directory: apps/dashboard-${{ matrix.app }}
        run: |
          npm install
          npm run build

      - name: Build Tauri (macOS)
        working-directory: apps/desktop-${{ matrix.app }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          npm init -y
          npm install --save-dev @tauri-apps/cli@^2
          npx tauri build --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-macos
          path: apps/desktop-${{ matrix.app }}/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
