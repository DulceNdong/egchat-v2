name: Deploy EGCHAT API

on:
  push:
    branches: [main, mobile]
    paths:
      - 'server/egchat-api/**'
      - 'server/migrations/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  validate-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/egchat-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/egchat-api/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: node kyc/tests/run-kyc-tests.js

  deploy-render:
    needs: validate-api
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
