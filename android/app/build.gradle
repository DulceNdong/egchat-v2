apply plugin: 'com.android.application'

android {
    namespace = "com.egchat.app"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.egchat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.5.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ── Firma de producción via variables de entorno ──────────────────────────
    // Configurar en Render/CI o localmente:
    //   KEYSTORE_PATH  = ruta al .keystore
    //   KEYSTORE_PASS  = contraseña del keystore
    //   KEY_ALIAS      = alias de la clave (egchat)
    //   KEY_PASS       = contraseña de la clave
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: project.findProperty("KEYSTORE_PATH") ?: ""
            def keystorePass = System.getenv("KEYSTORE_PASS") ?: project.findProperty("KEYSTORE_PASS") ?: ""
            def keyAlias     = System.getenv("KEY_ALIAS")     ?: project.findProperty("KEY_ALIAS")     ?: "egchat"
            def keyPass      = System.getenv("KEY_PASS")      ?: project.findProperty("KEY_PASS")      ?: ""

            if (keystorePath && file(keystorePath).exists()) {
                storeFile     file(keystorePath)
                storePassword keystorePass
                keyAlias      keyAlias
                keyPassword   keyPass
            }
        }
    }

    buildTypes {
        release {
            // Activar minify para reducir tamaño del APK (~30% más pequeño)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Usar firma de producción si está configurada
            def ks = System.getenv("KEYSTORE_PATH") ?: project.findProperty("KEYSTORE_PATH") ?: ""
            if (ks && file(ks).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
