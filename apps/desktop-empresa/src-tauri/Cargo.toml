[package]
name    = "egchat-kyc-monitor"
version = "1.0.0"
edition = "2021"

[lib]
name = "egchat_kyc_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                     = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater      = "2"
tauri-plugin-notification = "2"
serde                     = { version = "1", features = ["derive"] }
serde_json                = "1"
dirs                      = "5"
hostname                  = "0.3"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
