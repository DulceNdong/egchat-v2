services:
  - type: web
    name: egchat-api
    env: node
    plan: starter
    buildCommand: cd egchat-api && npm install
    startCommand: cd egchat-api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 2.5.1
      - key: ENABLE_EXTERNAL_NEWS_SCRAPING
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: https://egchat-app.vercel.app,https://egchat-v2.vercel.app,http://localhost:3001,http://localhost:3003,http://localhost:5173,http://127.0.0.1:3001
      - key: SUPABASE_URL
        value: https://fqfxtjnfhvpggssbymdn.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LOCAL_AUTH_FALLBACK
        value: "false"
