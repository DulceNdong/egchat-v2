<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Actualizando EGCHAT...</title>
  <style>
    body { margin:0; background:#00c8a0; display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; font-family:sans-serif; color:#fff; }
    .spinner { width:48px; height:48px; border:4px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:20px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    p { font-size:16px; font-weight:600; margin:0; }
    small { font-size:13px; opacity:0.8; margin-top:8px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Actualizando EGCHAT...</p>
  <small>Por favor espera un momento</small>
  <script>
    (async function() {
      // 1. Desregistrar todos los Service Workers
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      // 2. Limpiar todas las cachés
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      // 3. Limpiar localStorage de versión para forzar reload en main.tsx
      localStorage.removeItem('egchat_app_version');
      // 4. Redirigir a la app con cache-bust
      window.location.replace('/?v=' + Date.now());
    })();
  </script>
</body>
</html>
