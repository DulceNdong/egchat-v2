pluginManagement {
  try {
    def userHome = System.getProperty("user.home") ?: ""
    def nvmDir = new File(userHome, ".nvm/versions/node")
    def nvmBinPaths = (nvmDir.exists() && nvmDir.isDirectory()) ? nvmDir.listFiles()?.collect { new File(it, "bin").absolutePath } : []

    def extraPaths = ([
      "/usr/local/bin",
      "/opt/homebrew/bin",
      "/usr/local/opt/node/bin",
      "${userHome}/.fnm/current/bin",
      "${userHome}/.volta/bin",
      "${userHome}/.asdf/shims",
      System.getenv("NODE_BINARY") ? new File(System.getenv("NODE_BINARY")).parent : null
    ] + (nvmBinPaths ?: [])).findAll { it && new File(it).exists() }

    def pathPrefix = extraPaths.join(File.pathSeparator)
    def nodeExec = ([
      System.getenv("NODE_BINARY"),
      "/usr/local/bin/node",
      "/opt/homebrew/bin/node",
      "/usr/local/opt/node/bin/node",
      "${userHome}/.fnm/current/bin/node",
      "${userHome}/.volta/bin/node",
      "${userHome}/.asdf/shims/node"
    ] + (nvmBinPaths?.collect { "$it/node" } ?: [])).find { it && new File(it).exists() } ?: "node"

    def unsafeClass = Class.forName("sun.misc.Unsafe")
    def fUnsafe = unsafeClass.getDeclaredField("theUnsafe")
    fUnsafe.setAccessible(true)
    def unsafe = fUnsafe.get(null)

    def peClass = Class.forName("java.lang.ProcessEnvironment")

    def getStaticField = { String fieldName ->
      try {
        def f = peClass.getDeclaredField(fieldName)
        def base = unsafe.staticFieldBase(f)
        def offset = unsafe.staticFieldOffset(f)
        return unsafe.getObject(base, offset)
      } catch (Throwable ignored) {
        return null
      }
    }

    def envMap = getStaticField("theEnvironment") as Map

    if (envMap != null) {
      def pathEntry = envMap.entrySet().find { it.key.toString().equalsIgnoreCase("PATH") }
      if (pathEntry != null) {
        def curPath = pathEntry.value.toString()
        if (!curPath.startsWith(pathPrefix)) {
          def newPathStr = pathPrefix + File.pathSeparator + curPath
          def valObj = pathEntry.value
          def extClass = valObj.getClass().getSuperclass()
          def fStr = extClass.getDeclaredField("str")
          def fBytes = extClass.getDeclaredField("bytes")
          unsafe.putObject(valObj, unsafe.objectFieldOffset(fStr), newPathStr)
          unsafe.putObject(valObj, unsafe.objectFieldOffset(fBytes), newPathStr.getBytes())
        }
      }

      def varClass = Class.forName("java.lang.ProcessEnvironment\$Variable")
      def valClass = Class.forName("java.lang.ProcessEnvironment\$Value")

      def nodeVar = unsafe.allocateInstance(varClass)
      def nodeVal = unsafe.allocateInstance(valClass)

      def extClass = varClass.getSuperclass()
      def fStr = extClass.getDeclaredField("str")
      def fBytes = extClass.getDeclaredField("bytes")

      unsafe.putObject(nodeVar, unsafe.objectFieldOffset(fStr), "NODE_BINARY")
      unsafe.putObject(nodeVar, unsafe.objectFieldOffset(fBytes), "NODE_BINARY".getBytes())

      unsafe.putObject(nodeVal, unsafe.objectFieldOffset(fStr), nodeExec)
      unsafe.putObject(nodeVal, unsafe.objectFieldOffset(fBytes), nodeExec.getBytes())

      envMap.put(nodeVar, nodeVal)
    }
  } catch (Throwable ignored) {}

  def userHome = System.getProperty("user.home") ?: ""
  def nvmDir = new File(userHome, ".nvm/versions/node")
  def nvmBinPaths = (nvmDir.exists() && nvmDir.isDirectory()) ? nvmDir.listFiles()?.collect { new File(it, "bin/node").absolutePath } : []

  def nodeBin = ([
    System.getenv("NODE_BINARY"),
    "/usr/local/bin/node",
    "/opt/homebrew/bin/node",
    "/usr/local/opt/node/bin/node",
    "${userHome}/.fnm/current/bin/node",
    "${userHome}/.volta/bin/node",
    "${userHome}/.asdf/shims/node"
  ] + (nvmBinPaths ?: [])).find { it && new File(it).exists() } ?: "node"

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeBin, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeBin, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'EGCHAT'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
