pluginManagement {
  try {
    def userHome = System.getProperty("user.home") ?: ""
    def nvmDir = new File(userHome, ".nvm/versions/node")
    def nvmBinPaths = (nvmDir.exists() && nvmDir.isDirectory()) ? nvmDir.listFiles()?.collect { new File(it, "bin").absolutePath } : []

    def extraPaths = ([
      "/usr/local/bin",
      "/opt/homebrew/bin",
      "/usr/local/opt/node/bin",
      "${userHome}/.fnm/current/bin",
      "${userHome}/.volta/bin",
      "${userHome}/.asdf/shims",
      System.getenv("NODE_BINARY") ? new File(System.getenv("NODE_BINARY")).parent : null
    ] + (nvmBinPaths ?: [])).findAll { it && new File(it).exists() }

    if (!extraPaths.isEmpty()) {
      def pathPrefix = extraPaths.join(File.pathSeparator)

      try {
        def peClass = Class.forName("java.lang.ProcessEnvironment")

        def fEnv = peClass.getDeclaredField("theEnvironment")
        fEnv.setAccessible(true)
        def envMap = fEnv.get(null) as Map

        def fUnmod = peClass.getDeclaredField("theUnmodifiableEnvironment")
        fUnmod.setAccessible(true)
        def unmodMap = fUnmod.get(null) as Map

        def valClass = Class.forName("java.lang.ProcessEnvironment\$Value")
        def valValueOf = valClass.getDeclaredMethod("valueOf", String.class)
        valValueOf.setAccessible(true)

        def varClass = Class.forName("java.lang.ProcessEnvironment\$Variable")
        def varValueOf = varClass.getDeclaredMethod("valueOf", String.class)
        varValueOf.setAccessible(true)

        def pathVar = varValueOf.invoke(null, "PATH")

        def pathEntry = envMap.entrySet().find { it.key.toString().equalsIgnoreCase("PATH") }
        if (pathEntry != null) {
          def curPath = pathEntry.value.toString()
          if (!curPath.startsWith(pathPrefix)) {
            def newPathStr = pathPrefix + File.pathSeparator + curPath
            def newValObj = valValueOf.invoke(null, newPathStr)
            envMap.put(pathVar, newValObj)

            if (unmodMap != null) {
              try {
                def fM = unmodMap.getClass().getDeclaredField("m")
                fM.setAccessible(true)
                def innerMap = fM.get(unmodMap) as Map
                if (innerMap != null) {
                  innerMap.put(pathVar, newValObj)
                }
              } catch (Throwable ignored) {}
            }
            println "DEBUG: Value replacement SUCCEEDED! System.getenv('PATH') = " + System.getenv("PATH")
          }
        }
      } catch (Throwable t) {
        println "DEBUG: Value replacement failed: " + t
      }
    }
  } catch (Throwable ignored) {}

  def nvmDir = new File(System.getProperty("user.home"), ".nvm/versions/node")
  def nvmBinPaths = (nvmDir.exists() && nvmDir.isDirectory()) ? nvmDir.listFiles()?.collect { new File(it, "bin/node").absolutePath } : []

  def nodeExec = ([
    System.getenv("NODE_BINARY"),
    "/usr/local/bin/node",
    "/opt/homebrew/bin/node"
  ] + (nvmBinPaths ?: [])).find { it && new File(it).exists() } ?: "node"

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExec, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExec, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'EGCHAT'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
