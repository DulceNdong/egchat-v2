<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGCHAT — QR Descarga</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
    }
    .header { text-align: center; margin-bottom: 36px; }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #00c8a0, #00b4e6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 6px 20px rgba(0,200,160,0.35);
    }
    .logo span { font-size: 22px; font-weight: 900; color: white; letter-spacing: 1px; }
    h1 { font-size: 26px; font-weight: 900; color: #111; }
    .tagline { font-size: 13px; color: #6b7280; margin-top: 4px; }
    .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      width: 220px;
    }
    .card-title { font-size: 16px; font-weight: 800; color: #111; margin-bottom: 4px; }
    .card-sub { font-size: 11px; color: #9ca3af; margin-bottom: 16px; }
    canvas { display: block; margin: 0 auto; }
    .card-url { font-size: 10px; color: #9ca3af; margin-top: 12px; word-break: break-all; }
    .print-btn {
      margin-top: 32px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #00c8a0, #00b4e6);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    @media print { .print-btn { display: none; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><span>EG</span></div>
    <h1>EGCHAT</h1>
    <p class="tagline">Mensajería de Guinea Ecuatorial 🇬🇶</p>
  </div>
  <div class="cards">
    <div class="card">
      <div class="card-title">🤖 Android</div>
      <div class="card-sub">Escanea para descargar la APK</div>
      <canvas id="qr-android"></canvas>
      <div class="card-url">APK v2.5 · Google Drive</div>
    </div>
    <div class="card">
      <div class="card-title">🍎 iPhone</div>
      <div class="card-sub">Escanea y añade a inicio en Safari</div>
      <canvas id="qr-ios"></canvas>
      <div class="card-url">egchat-v2.vercel.app</div>
    </div>
  </div>
  <button class="print-btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <script>
    QRCode.toCanvas(document.getElementById('qr-android'),
      'https://drive.google.com/uc?export=download&id=1J9SLvEHs9QFMQijypoZBmwl7dWlInR6V',
      { width: 170, margin: 1, color: { dark: '#111827', light: '#f8fafc' } }
    );
    QRCode.toCanvas(document.getElementById('qr-ios'),
      'https://egchat-v2.vercel.app',
      { width: 170, margin: 1, color: { dark: '#00b4e6', light: '#f8fafc' } }
    );
  </script>
</body>
</html>
